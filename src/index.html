
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
    <div class="container">
        <div class="InputTile">
            <form id="ticketForm">
                <label for="title">Tytuł zgłoszenia:</label>
                <input
                    type="text"
                    placeholder="Nazwa"
                    name="title"
                    id="title"
                    minlength="3"
                    maxlength="80"
                    required
                >

                <br>

                <div id="statusTile">
                    <p>Status:</p>

                    <input type="radio" name="status" id="statusnew"
                        value="new" checked class="RadioStatus">
                    <label for="statusnew">new</label>

                    <input type="radio" name="status" id="statusdoing"
                        value="doing" class="RadioStatus">
                    <label for="statusdoing">doing</label>

                    <input type="radio" name="status" id="statusdone"
                        value="done" class="RadioStatus">
                    <label for="statusdone">done</label>
                </div>

                <br>

                <div id="PriorityTile">
                    <p>Priorytet:</p>

                    <input type="radio" name="Priorytet"
                        id="NiskiPriorytet" value="low" class="RadioPriorytet">
                    <label for="NiskiPriorytet" style="color: greenyellow;">Niski</label>

                    <input type="radio" name="Priorytet"
                        id="ŚredniPriorytet" value="normal" checked class="RadioPriorytet" >
                    <label for="ŚredniPriorytet" style="color: yellow;"">Średni</label>

                    <input type="radio" name="Priorytet"
                        id="WysokiPriorytet" value="high" class="RadioPriorytet" >
                    <label for="WysokiPriorytet" style="color: red;""> Wysoki</label>
                </div>

                <br>

                <button type="button" id="add">
                    Dodaj zgłoszenie
                </button>
            </form>
        </div>

        <div class="ShowTile">
            <p id="ticketCounter">Widoczne: 0 / Wszystkie: 0</p>
            <div id="ticketList"></div>
        </div>
    </div>
    </center>
</body>
</html>
