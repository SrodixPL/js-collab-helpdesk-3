<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="InputTile">
            <form>
                <Input type="text" placeholder="Nazwa" name="Nazwa" id="title"></Input><br>


                <div id="statusTile">
                <input type="radio" name="status" id="statusnew" checked="checked">
                <label for="statusnew">new</label>
                
                <input type="radio" name="status" id="statusdoing">
                <label for="statusdoing">doing</label>
                
                <input type="radio" name="status" id="statusdone">
                <label for="statusdone">done</label>
                </div>
                <br>
                <div id="PriorityTile">
                <input type="radio" name="Priorytet" id="NiskiPriorytet">
                <label for="NiskiPriorytet">Niski</label>
                
                <input type="radio" name="Priorytet" id="ŚredniPriorytet" checked="checked">
                <label for="ŚredniPriorytet">Średni</label>
                
                <input type="radio" name="Priorytet" id="WysokiPriorytet">
                <label for="WysokiPriorytet">Wysoki</label>
                </div>
                <br>

                <Input type="button" onclick="createTicket()"></Input>
            </form>
            
        </div>
        <div class="ShowTile"></div>
    </div>
</body>
</html>
